name: renault_obd_scanner
description: تطبيق سكانر OBD2 عبر محول ELM327 (بلوتوث كلاسيك) لسيارة رينو فلوانس 2017
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # ملاحظة: هذه الحزمة تتعامل مع بلوتوث كلاسيك (SPP) وهو ما تستخدمه أغلب محولات ELM327 الرخيصة.
  # إذا واجهت مشاكل بالتوافق عند flutter pub get، جرّب البديل: flutter_bluetooth_serial_ble
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  # كتابة ملفات CSV على القرص ومشاركتها
  # ملاحظة: لو فشل flutter pub get بسبب share_plus، جرّب share_plus: ^7.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dtc_codes_ar.json
