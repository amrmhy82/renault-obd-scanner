name: matal_fluence_scan
description: تطبيق ماتال - سكانر OBD2 عبر محول ELM327 (بلوتوث كلاسيك) لسيارة رينو فلوانس 2017
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # ملاحظة: هذه الحزمة تتعامل مع بلوتوث كلاسيك (SPP) وهو ما تستخدمه أغلب محولات ELM327 الرخيصة.
  # إذا واجهت مشاكل بالتوافق عند flutter pub get، جرّب البديل: flutter_bluetooth_serial_ble
  flutter_bluetooth_serial: ^0.4.0
  # بلوتوث BLE (بلوتوث 4.0 منخفض الطاقة) لمحولات ELM327 الحديثة الصغيرة.
  # مثبّتة على سلسلة 1.x عمدًا: الإصدار 2.0+ غيّر الترخيص وواجهة connect().
  flutter_blue_plus: ">=1.32.0 <1.35.0"
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  # كتابة ملفات CSV على القرص ومشاركتها
  # ملاحظة: لو فشل flutter pub get بسبب share_plus، جرّب share_plus: ^7.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # يولّد أيقونة التطبيق لكل الأحجام المطلوبة من صورة واحدة
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/dtc_codes_ar.json
    - assets/icon/app_icon.png

# إعدادات مولّد أيقونة التطبيق — شغّل الأمر التالي بعد flutter pub get:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # خلفية بيضاء لتطابق خلفية الشعار الأصلية، مع نفس الصورة كطبقة أمامية
  # لأيقونات أندرويد المتكيفة (Adaptive Icons)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
