name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # يسمح بتشغيله يدويًا من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      # يولّد مجلد android/ من جديد في كل تشغيل (المستودع لا يحتوي android/)
      # ملاحظة: --project-name لازم يطابق name: في pubspec.yaml
      - name: Generate missing Android and Gradle files
        run: flutter create . --platforms=android --project-name=matal_fluence_scan --org com.matal

      - name: Fix Kotlin version conflict
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    resolutionStrategy {" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      # يضيف صلاحيات البلوتوث (CONNECT/SCAN) + اسم التطبيق + minSdk=21.
      # هذه الخطوة كانت ناقصة، وغيابها هو سبب خطأ BLUETOOTH_CONNECT permission.
      - name: Patch AndroidManifest and Gradle (permissions, label, minSdk)
        run: dart run tool/setup_android.dart

      # يولّد أيقونة Matal بدل أيقونة Flutter الافتراضية.
      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
